
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniExtract Pro | System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: ui-monospace, monospace; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none; }
        /* Custom scrollbar for log panel */
        #consoleLog::-webkit-scrollbar { width: 4px; }
        #consoleLog::-webkit-scrollbar-track { background: transparent; }
        #consoleLog::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-widest">OMNI EXTRACTOR</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase">Optimized for Google Contacts</p>
            </div>
            <button id="resetBtn" class="text-[10px] text-red-400 border border-red-900 bg-red-900/10 px-3 py-1 rounded hover:bg-red-900/20 transition-colors uppercase font-bold">SYSTEM RESET</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Controls & Stats -->
            <div class="space-y-6">
                <!-- Upload Zone -->
                <div class="glass p-10 rounded-2xl border-2 border-dashed border-slate-600 hover:border-blue-500 transition-all cursor-pointer relative group">
                    <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="text-center group-hover:scale-105 transition-transform">
                        <div class="text-4xl mb-3">📁</div>
                        <p class="text-sm font-bold text-white uppercase tracking-wider">Select Batch Images</p>
                        <p class="text-[10px] text-slate-500 mt-2 uppercase">Max 20 Files per Process</p>
                    </div>
                </div>

                <!-- Progress Panel -->
                <div id="statusPanel" class="glass p-4 rounded-xl hidden">
                    <div class="flex justify-between text-[10px] mb-2 font-bold tracking-widest">
                        <span id="currentStatus" class="text-blue-400">INITIALIZING...</span>
                        <span id="percentText" class="text-slate-400">0%</span>
                    </div>
                    <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-600 w-0 transition-all duration-300 shadow-[0_0_8px_rgba(37,99,235,0.6)]"></div>
                    </div>
                </div>

                <!-- Stats Card -->
                <div class="glass p-6 rounded-2xl border border-slate-700/50 shadow-xl">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Unique Detections:</span>
                        <span id="countBadge" class="text-3xl font-black text-emerald-400 font-sans">0</span>
                    </div>
                    <button id="dlBtn" disabled class="w-full py-5 bg-slate-800 text-slate-500 rounded-xl text-xs font-bold border border-slate-700 tracking-widest transition-all uppercase shadow-md">
                        Download Google CSV
                    </button>
                </div>
            </div>

            <!-- Log Panel -->
            <div class="glass p-0 rounded-2xl overflow-hidden flex flex-col h-[420px] shadow-2xl border border-slate-700/50">
                <div class="bg-slate-900/80 p-3 border-b border-slate-700 flex justify-between items-center">
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">CORE_ENGINE_LOGS</span>
                    <div class="flex space-x-1">
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    </div>
                </div>
                <div id="consoleLog" class="flex-1 p-4 text-[11px] text-emerald-500/80 overflow-y-auto space-y-1 bg-black/40 font-mono">
                    <p class="text-slate-500 opacity-60">:: System online. Neural pathways connected.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Processing Engine -->
    <canvas id="procCanvas" class="hidden"></canvas>
    <script type="module" src="index.tsx"></script>
</body>
</html>
