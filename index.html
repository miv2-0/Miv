<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniExtract Pro | Stealth Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: ui-monospace, monospace; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none; }
        /* Scrollbar styling for log panel */
        #consoleLog::-webkit-scrollbar { width: 4px; }
        #consoleLog::-webkit-scrollbar-track { background: transparent; }
        #consoleLog::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl space-y-6">
        
        <div class="flex justify-between items-center pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-widest uppercase">OmniExtract <span class="text-blue-500">Pro</span></h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Stealth OCR Engine Active</p>
            </div>
            <button id="resetBtn" class="text-[10px] text-red-400 border border-red-900 bg-red-900/10 px-3 py-1 rounded hover:bg-red-900/30 transition-all uppercase font-bold">RESET SYSTEM</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="space-y-6">
                <!-- Upload Zone -->
                <div class="glass p-12 rounded-3xl border-2 border-dashed border-slate-600 hover:border-blue-500 transition-all cursor-pointer relative group">
                    <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="text-center group-hover:scale-105 transition-transform duration-300">
                        <div class="text-5xl mb-4">📥</div>
                        <p class="text-sm font-bold text-white tracking-wide italic">UPLOAD SOURCE IMAGES</p>
                        <p class="text-[10px] text-slate-500 mt-2 uppercase">Batch Processing Enabled</p>
                    </div>
                </div>

                <!-- Status Panel -->
                <div id="statusPanel" class="glass p-5 rounded-2xl hidden animate-in fade-in duration-500">
                    <div class="flex justify-between text-[10px] mb-2 font-bold tracking-widest">
                        <span id="currentStatus" class="text-blue-400 animate-pulse uppercase">ANALYZING...</span>
                        <span id="percentText" class="text-white">0%</span>
                    </div>
                    <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-600 w-0 transition-all duration-300 shadow-[0_0_8px_rgba(37,99,235,0.6)]"></div>
                    </div>
                </div>

                <!-- Controls & Statistics -->
                <div class="glass p-6 rounded-3xl space-y-5">
                    <div class="flex justify-between items-center">
                        <div class="space-y-1">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Unique Detections</p>
                            <h2 id="countBadge" class="text-4xl font-black text-emerald-400 leading-none">0</h2>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-500 font-bold uppercase">Format</p>
                            <p class="text-xs text-white font-bold">+91 Mobile Only</p>
                        </div>
                    </div>
                    
                    <button id="dlBtn" disabled class="w-full py-4 bg-slate-800 text-slate-500 rounded-2xl text-xs font-black border border-slate-700 tracking-widest transition-all uppercase shadow-md active:scale-95">
                        DOWNLOAD CONTACTS (CSV)
                    </button>
                </div>
            </div>

            <!-- Console Log Panel -->
            <div class="glass p-0 rounded-3xl overflow-hidden flex flex-col h-[420px] shadow-2xl border border-slate-700/50">
                <div class="bg-slate-900/80 p-4 border-b border-slate-700 flex items-center justify-between">
                    <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Core Engine Logs</span>
                    <div class="flex gap-1">
                        <div class="w-2 h-2 rounded-full bg-red-500/50"></div>
                        <div class="w-2 h-2 rounded-full bg-yellow-500/50"></div>
                        <div class="w-2 h-2 rounded-full bg-green-500/50"></div>
                    </div>
                </div>
                <div id="consoleLog" class="flex-1 p-5 text-[11px] text-emerald-500/80 overflow-y-auto space-y-2 bg-black/40 font-mono">
                    <p class="text-slate-500 font-bold">:: OMNI-CORE INITIALIZED. WAITING FOR INPUT...</p>
                </div>
            </div>
        </div>
    </div>

    <canvas id="procCanvas" class="hidden"></canvas>

    <script type="module" src="index.tsx"></script>
</body>
</html>
